services: 

  # Infrastructural Services

  # - Persistence Layer: PostgreSQL
  # - Message Broker: RabbitMQ
  # - LLM Service: Ollama

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smart_budget_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  rabbitmq: 
    build: ./rabbitmq
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:7b"]
    restart: "no"

  # Application Services
  # - Web Frontend: React.js
  # - Domain Logic Backend: Node.js
  # - AI Backend (orchestrator, speech-to-text, llm): Node.js + Python

  web: 
    build: ./ui
    container_name: web
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"

  backend: 
    build: ./backend
    container_name: backend
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/smart_budget_tracker
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AUDIO_STORAGE_PATH: /audio_files
      IMAGE_STORAGE_PATH: /image_files
    ports:
      - "3001:3001"
    volumes:
      - audio_files:/audio_files
      - image_files:/image_files
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    
  ai-backend:
    build: 
      context: ./ai/backend
      dockerfile: api/Dockerfile
    container_name: ai-backend
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      BACKEND_URL: http://backend:3001
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

  speech-to-text:
    build: ./ai/speech-to-text
    container_name: speech-to-text
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      AUDIO_STORAGE_PATH: /audio_files
    volumes:
      - audio_files:/audio_files
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  ocr:
    build: ./ai/ocr
    container_name: ocr
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      IMAGE_STORAGE_PATH: /image_files
    volumes:
      - image_files:/image_files
    depends_on:
      rabbitmq:
        condition: service_healthy

  llm:
    build: ./ai/llm
    container_name: llm
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
        
volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:
  audio_files:
  image_files:

